name: דיווח על תקלה
description: משהו לא עובד כמצופה
labels: [תקלה]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: מה קרה
      description: מה עשית, מה ציפית שיקרה, ומה קרה בפועל
      placeholder: |
        1. נכנסתי לכרטיסיית חבר
        2. לחצתי "הזנת נדר"
        3. ציפיתי ש... אבל קיבלתי...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: גרסה
      description: 'מופיעה בהגדרות ← אודות ורישוי'
      placeholder: 0.1.0
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: צילום מסך
      description: אפשר לגרור תמונה לכאן. עוזר מאוד.

  - type: checkboxes
    id: privacy
    attributes:
      label: לפני השליחה
      options:
        - label: ווידאתי שאין בצילום שמות חברים, סכומים או פרטים אישיים
          required: true
